version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: researchmind-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: researchmind
      POSTGRES_PASSWORD: researchmind_secure_password
      POSTGRES_DB: researchmind
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U researchmind"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: researchmind-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql://researchmind:researchmind_secure_password@postgres:5432/researchmind
      - CHROMA_PERSIST_DIR=/app/data/chroma
      - DATA_DIR=/app/data
      - UPLOAD_DIR=/app/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend/data:/app/data

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: researchmind-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_BASE=http://localhost:8000/api/v1
    depends_on:
      - backend

volumes:
  postgres_data:
