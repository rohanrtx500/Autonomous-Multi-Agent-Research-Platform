name: ResearchMind AI CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test-backend:
    name: Run Backend Test Suite & Type Checks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Run Ruff Linting
        run: |
          cd backend
          ruff check .

      - name: Run Pytest Test Suite
        env:
          PYTHONPATH: backend
        run: |
          cd backend
          python -m pytest tests/unit tests/api --tb=short
